  <h1>Q4: Number Range from 5 to 15</h1>
  <p>This loop starts its counter at 5, continues while the counter is below 15, and logs the counter plus one.</p>
  <p>Open the browser Developer Tools Console to see the values from 6 through 15.</p>
  <script>
    let num1=5;
    let num2=15;
    for (let i=5; i<15;i++){
      console.log("A number between 5 and 15 is:",i+1)
    }
  </script>
