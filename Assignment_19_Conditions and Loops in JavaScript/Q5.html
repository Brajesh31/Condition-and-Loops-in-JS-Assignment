<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5: Ascending and Descending Loops in JavaScript</title>
</head>
<body>
  <h1>Q5: Ascending and Descending Order</h1>
  <p>The first while loop displays values from 1 to 25. The second displays values from 24 down to 1.</p>
  <p>Open the browser Developer Tools Console to inspect the output.</p>
  <script>
    let i=0;
    while (i<25){
      console.log("Ascending order", i+1);
      i++;
    }
    let j=25;
    while(j>1){
      console.log("Descending order",j-1);
      j--;
    }
  </script>
</body>
</html>
