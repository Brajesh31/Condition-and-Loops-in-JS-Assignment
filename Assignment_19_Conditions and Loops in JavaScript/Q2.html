<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2: Grade Classification with Conditional Statements</title>
</head>
<body>
  <h1>Q2: Grade Classification</h1>
  <p>This example checks a marks value against descending grade thresholds and logs the first matching grade.</p>
  <img src="asset/asset4.png" alt="Illustration for the JavaScript grade classification example">
  
  <script>
    let marks=80
    if (marks>=90){
      console.log("grade A")
    }
    else if(marks>=70){
      console.log("grade B")
    }
    else if(marks>=50){
      console.log("grade C")
    }
    else{
      console.log("grade F")
    }

    // in this case you got grade B
  </script>
</body>
</html>
