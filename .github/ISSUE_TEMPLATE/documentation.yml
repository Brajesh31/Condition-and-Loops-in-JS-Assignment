name: "📚 Documentation issue"
description: "Report an unclear, missing, or inaccurate explanation."
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs correction?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
    validations:
      required: false
