name: Update README Maintenance Timestamp

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-maintenance
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Update README timestamp on manual request
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          if grep -q "Last updated:" README.md; then
            sed -i "s/Last updated:.*/Last updated: $DATE/" README.md
          else
            printf "\\nLast updated: %s\\n" "$DATE" >> README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore: update README maintenance timestamp"
          git push origin HEAD
