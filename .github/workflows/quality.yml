name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check exercise pages and assets
        run: python scripts/validate-exercises.py
      - name: Check required project files
        run: python scripts/check-project-structure.py
      - name: Check documentation links
        run: python scripts/validate-docs.py
      - name: Check Markdown whitespace
        run: python scripts/validate-markdown.py
